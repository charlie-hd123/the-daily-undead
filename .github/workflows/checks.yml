name: Candidate checks
on:
  push:
    branches: [staging]
  pull_request:
    branches: [staging, main]
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: pnpm/action-setup@v4
        with:
          version: 11.25.0
          run_install: false
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Complete automated suite
        run: node --test --test-reporter=spec
      - name: Build both environments from the same commit
        run: |
          node scripts/build-site.mjs staging
          node scripts/build-site.mjs production
          node --input-type=module -e "import fs from 'node:fs'; const a=JSON.parse(fs.readFileSync('.staging-dist/release-manifest.json')); const b=JSON.parse(fs.readFileSync('.production-dist/release-manifest.json')); if(a.applicationDigest!==b.applicationDigest || a.apiDigest!==b.apiDigest) process.exit(1);"
  pages-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Rehearse the GitHub Pages build without publishing
        uses: actions/jekyll-build-pages@v1
        with:
          verbose: false
      - name: Compare Pages output with the website file list
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import { readFileSync, readdirSync } from 'node:fs';
          import { join } from 'node:path';
          import { isWebsiteFile, trackedFiles } from './scripts/lib/release-tools.mjs';

          const output = '_site';
          const sourceFiles = trackedFiles(process.cwd()).filter(isWebsiteFile);
          // GitHub Pages already serves these generated URLs alongside the source files.
          const generatedFiles = [
            'assets/audio/CREDITS.html',
            'assets/audio/auditions-2026-10-21/CREDITS.html',
            'assets/audio/auditions-2026-10-23-layered/CREDITS.html',
            'assets/audio/auditions-2026-10-23-lift/CREDITS.html',
            'assets/audio/auditions-2026-10-23/CREDITS.html',
            'assets/audio/sources/CREDITS.html',
            'assets/css/style.css',
            'data/WORD_BANK.html',
          ];
          const expected = [...sourceFiles, ...generatedFiles].sort();
          const actual = readdirSync(output, { recursive: true, withFileTypes: true })
            .filter(entry => entry.isFile())
            .map(entry => join(entry.parentPath, entry.name).slice(output.length + 1))
            .sort();
          assert.deepEqual(actual, expected, 'GitHub Pages file list differs from the website file list');
          for (const file of sourceFiles) {
            assert.ok(readFileSync(join(output, file)).equals(readFileSync(file)), `GitHub Pages changed ${file}`);
          }
          console.log(`GitHub Pages preserved ${sourceFiles.length} website files and ${generatedFiles.length} existing generated URLs.`);
          NODE
