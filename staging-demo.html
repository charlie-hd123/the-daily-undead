<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#070a12">
    <meta name="referrer" content="strict-origin-when-cross-origin">
    <meta name="description" content="Staging prototype for The Daily Undead multi-puzzle daily game.">
    <title>The Daily Undead</title>
    <link rel="icon" href="./assets/favicon.png" type="image/png" sizes="128x128">
    <link rel="apple-touch-icon" href="./assets/apple-touch-icon.png" sizes="180x180">
    <link rel="stylesheet" href="./styles.css">
    <link rel="stylesheet" href="./staging-demo.css">
  </head>
  <body>
    <header class="site-header demo-site-header">
      <div class="brand-lockup">
        <img class="brand-logo" src="./assets/zombie-logo.png" alt="" width="512" height="512">
        <div class="brand-copy">
          <p class="eyebrow">Your daily Treyarch Zombies challenge</p>
          <h1>The Daily Undead</h1>
        </div>
      </div>
      <div class="header-meta">
        <div class="header-utility">
          <div class="round-timing">
            <p id="demo-date" class="puzzle-date"></p>
            <p class="next-round">Next Round <strong id="demo-countdown">--:--:--</strong></p>
          </div>
        </div>
        <div class="player-stats" aria-label="Prototype player statistics">
          <span class="stat-display">Score <strong id="demo-score">0</strong></span>
          <span class="stat-display subdued-stat">Solves <strong id="demo-solves">0</strong></span>
          <span class="stat-display subdued-stat">Round <strong id="demo-round">1</strong></span>
        </div>
      </div>
    </header>

    <main id="demo-app" class="app-shell">
      <section class="panel loading-panel"><h2>Loading today’s puzzles…</h2></section>
    </main>

    <section class="community-stats community-stats-demo" aria-label="Daily Undead community statistics" aria-live="polite">
      <div class="community-overview">
        <p class="community-stat">
          <strong>20</strong>
          <span>players today</span>
        </p>
        <p class="community-stat">
          <strong>2,911</strong>
          <span>total puzzles played all time</span>
        </p>
      </div>
      <div class="community-yesterday">
        <div class="community-yesterday-heading">
          <p>Yesterday’s puzzles</p>
          <span>Answer and solve rate</span>
        </div>
        <div class="community-result-grid">
          <article class="community-result">
            <div class="community-result-copy">
              <span>Quest Steps</span>
              <strong id="demo-yesterday-easter-answer">—</strong>
            </div>
            <div class="community-result-rate"><strong>82%</strong><span>solved</span></div>
          </article>
          <article class="community-result">
            <div class="community-result-copy">
              <span>Last Words</span>
              <strong id="demo-yesterday-word-answer">—</strong>
            </div>
            <div class="community-result-rate"><strong>74%</strong><span>solved</span></div>
          </article>
        </div>
      </div>
    </section>

    <footer class="site-footer demo-footer">
      <p>
        Staging prototype only.
        <button id="advance-demo-day" class="dev-day-button" type="button">ADVANCE A DAY</button>
      </p>
    </footer>

    <script type="module" src="./js/staging-demo.js"></script>
  </body>
</html>
